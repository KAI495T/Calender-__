
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Calendar</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

.container {
    max-width: 980px;
    margin: 20px auto;
}

h1 {
    font-size: 30px;
    font-weight: 500;
    padding-bottom: 15px;
    border-bottom: 1px solid #ddd;
}

.calendar {
    margin-top: 30px;
    padding: 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 25px #00000012;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.header h2 {
    margin: 0;
    font-size: 25px;
    color: #334155;
}

button {
    border: none;
    padding: 11px 17px;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.weekdays, .dates {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
    text-align: center;
}

.weekdays div {
    padding: 12px 0;
    font-weight: bold;
    color: #64748b;
}

.dates div {
    min-height: 65px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    background: #f8fafc;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
}

.dates div:not(.empty):hover {
    background: #dbeafe;
    color: #1d4ed8;
}

.dates .today {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

.dates .today:hover {
    background: #1d4ed8;
    color: white;
}

.empty {
    background: transparent !important;
    cursor: default !important;
}

#selectedDate {
    margin-top: 20px;
    color: #64748b;
    text-align: center;
}

@media (max-width: 500px) {
    .calendar {
        padding: 12px;
    }

    .dates, .weekdays {
        gap: 4px;
    }

    .dates div {
        min-height: 43px;
        font-size: 14px;
    }

    .header h2 {
        font-size: 19px;
    }

    button {
        padding: 9px;
    }
}
</style>
</head>

<body>
<div class="container">

    <h1>Calendar</h1>

    <div class="calendar">
        <div class="header">
            <button id="prev">❮</button>
            <h2 id="monthYear">Loading...</h2>
            <button id="next">❯</button>
        </div>

        <div class="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div class="dates" id="dates"></div>

        <p id="selectedDate">Select a date</p>
    </div>
</div>

<script>
const now = new Date();

let month = now.getMonth();
let year = now.getFullYear();

const monthYear = document.getElementById("monthYear");
const dates = document.getElementById("dates");
const selectedDate = document.getElementById("selectedDate");

function renderCalendar() {
    monthYear.textContent = new Date(year, month, 1)
        .toLocaleDateString("en-US", {
            month: "long",
            year: "numeric"
        });

    dates.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement("div");
        blank.className = "empty";
        dates.appendChild(blank);
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement("div");
        cell.textContent = day;

        if (
            day === now.getDate() &&
            month === now.getMonth() &&
            year === now.getFullYear()
        ) {
            cell.classList.add("today");
        }

        cell.addEventListener("click", function() {
            selectedDate.textContent =
                "Selected date: " +
                new Date(year, month, day).toLocaleDateString(
                    "en-IN",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );
        });

        dates.appendChild(cell);
    }
}

document.getElementById("prev").addEventListener("click", () => {
    month--;
    if (month < 0) {
        month = 11;
        year--;
    }
    renderCalendar();
});

document.getElementById("next").addEventListener("click", () => {
    month++;
    if (month > 11) {
        month = 0;
        year++;
    }
    renderCalendar();
});

renderCalendar();
</script>
</body>
</html>
